<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Activate Your Account</title>
</head>
<body>
    <p>Hi {{ user.first_name }},</p>

    <p>Thank you for signing up! Please click the link below to activate your account:</p>

    <p>
        <a href="http://{{ domain }}/activate/{{ uid }}/{{ token }}/">
            Activate Your Account
        </a>
    </p>

    <p>If clicking the link doesn’t work, copy and paste this URL into your browser:</p>

    <p>http://{{ domain }}/activate/{{ uid }}/{{ token }}/</p>

    <p>Thank you,<br>Your OneClickMart Team</p>
</body>
</html>
