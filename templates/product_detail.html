{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ product.name }} - Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
  <div class="row">
    <div class="col-md-6">
      {% with product.images.first as image %}
        {% if image %}
          <img src="{{ image.image.url }}" class="img-fluid" alt="{{ product.name }}">
        {% else %}
          <img src="{% static 'image/no-image.jpg' %}" class="img-fluid" alt="No image">
        {% endif %}
      {% endwith %}
    </div>
    <div class="col-md-6">
      <h2>{{ product.name }}</h2>

      <p>
        <span class="product-old-price text-muted text-decoration-line-through me-2">${{ product.old_price }}</span>
        <span class="product-price text-success fw-bold">${{ product.price }}</span>
      </p>

      <p>{{ product.description }}</p> <!-- Optional: show product description -->

      <form action="{% url 'add_to_cart' product.id %}" method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">Add to Cart</button>
      </form>

      <a href="{% url 'home' %}" class="btn btn-secondary mt-3">Back to Home</a>
    </div>
  </div>
</div>

</body>
</html>
